<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout - Tswana Antique Store</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="nav-logo">
        <a href="index.html"><img src="assets/img/logo.png" alt="Tswana Antique Store logo"></a>
      </div>
      <div class="nav-links">
        <a href="index.html" class="link-button">Home</a>
        <a href="cart.html" class="link-button">Cart</a>
      </div>
    </nav>
  </header>

  <main style="padding: 40px; max-width: 720px; margin: 0 auto;">
    <h1>Checkout</h1>
    <form id="checkout-form">
      <label>Full name<br><input type="text" name="name" required></label><br><br>
      <label>Email<br><input type="email" name="email" required></label><br><br>
      <label>Address<br><textarea name="address" rows="3" required></textarea></label><br><br>
      <label>Payment method<br>
        <select name="payment" required>
          <option value="card">Card (simulation)</option>
          <option value="cod">Cash on Delivery</option>
        </select>
      </label><br><br>
      <div style="text-align:right;">
        <button type="submit" class="link-button">Place Order</button>
      </div>
    </form>

    <div id="checkout-result" style="margin-top:20px;"></div>
  </main>

  <footer>
    <p style="text-align:center; color:#fff; background:#0f1111; padding:12px;">Tswana Antique Store</p>
  </footer>

  <script src="assets/js/checkout.js"></script>
</body>
</html>
